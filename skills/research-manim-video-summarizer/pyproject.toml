[project]
name = "research-manim-video-summarizer-skill"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "manim>=0.19.0",
  "pillow>=11.0.0",
  "pypdf>=5.0.0",
  "rich>=13.7.1",
  "typer>=0.12.5",
]

[dependency-groups]
dev = ["basedpyright>=1.31.4", "pytest>=8.3.0", "ruff>=0.12.0"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".omo", "scripts/fixtures"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]
allowed-confusables = ["α", "β", "γ", "μ", "σ", "θ"]

[tool.basedpyright]
include = ["scripts", "assets"]
exclude = ["scripts/test_*.py", "scripts/release_test_support.py", "scripts/fixtures", ".omo"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportAny = "none"
reportExplicitAny = "error"
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedCallResult = "none"
